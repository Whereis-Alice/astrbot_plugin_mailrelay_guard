<!doctype html>
<html lang="zh-CN" data-mail-theme="sage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>我的邮件 · 邮件工作空间</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <script>
    // 在样式加载前确定主题，避免首屏闪烁。与 theme.js 的键名和迁移保持一致。
    (function () {
      try {
        var raw = localStorage.getItem('my-mail-theme');
        var legacy = { light: 'sage', dark: 'ink' };
        var known = ['sage','ivory','harbor','rose','ink','nocturne','espresso'];
        var theme = legacy[raw] || (known.indexOf(raw) >= 0 ? raw : null);
        if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'sage';
        document.documentElement.setAttribute('data-mail-theme', theme);
      } catch (e) { /* 受限环境时回退到默认 sage */ }
    })();
  </script>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./components.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./views.css">
  <link rel="stylesheet" href="./charts.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
